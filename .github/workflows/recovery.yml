name: Recovery rehearsal

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/scripts/**'
      - 'infra/**'
      - 'compose*.yaml'
      - 'Dockerfile'
      - 'frontend/Dockerfile'
      - '.dockerignore'
      - 'requirements.txt'
      - 'frontend/package*.json'
      - 'hi_scenario/graphdb.py'
      - 'hi_scenario/api.py'
      - 'hi_scenario/explorer.py'
      - 'hi_scenario/model.py'
      - 'hi_scenario/rdf.py'
      - 'hi_scenario/validation.py'
      - 'hi_scenario/feedback.py'
      - 'ontology/**'
      - 'examples/**'
      - 'tests/test_*live.py'
      - 'tests/test_*recovery*.py'
      - 'tests/test_deploy*.py'
      - 'tests/test_ci_*.py'
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1' # Weekly on the default branch, UTC.

permissions:
  contents: read

concurrency:
  group: recovery-${{ github.ref }}
  cancel-in-progress: false

env:
  HI_NEBULA_LIVE: '0'
  NEBULA_API_KEY: ''
  PYTHONUNBUFFERED: '1'

jobs:
  recovery:
    name: Persistence, recovery and deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Start disposable GraphDB and load references
        run: |
          docker compose -f compose.yaml up -d --wait --wait-timeout 180
          python -m infra.graphdb setup
      - name: Concurrency, real connection failures and restart persistence
        run: python .github/scripts/required_tests.py -q tests/test_graphdb_live.py
        env:
          HI_GRAPHDB_LIVE: '1'
          GRAPHDB_URL: http://127.0.0.1:7200
          GRAPHDB_REPOSITORY: hi
      - name: Release the persistence-test database
        run: docker compose -f compose.yaml down --volumes
      - name: Synthetic capture → restore → authenticated container application
        run: python .github/scripts/rehearse.py
      - name: GraphDB diagnostics
        if: failure()
        run: docker compose -f compose.yaml logs --tail=100 graphdb
      - name: Remove disposable persistence-test data
        if: always()
        run: docker compose -f compose.yaml down --volumes
